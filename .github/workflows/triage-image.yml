name: triage image

on:
  push:
    branches: ['**']
    paths:
      - 'shared/**'
      - 'agents/triage/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/triage-image.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'agents/triage/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/triage-image.yml'
  workflow_dispatch:

concurrency:
  group: triage-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check

      - name: Pytest
        run: uv run pytest

  build-and-push:
    name: build + push
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment: namiview
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REPO: namiview-triage
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::015301735477:role/namiview-app-ci
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr-login.outputs.registry && format('{0}/{1}', steps.ecr-login.outputs.registry, env.ECR_REPO) || env.ECR_REPO }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch,prefix=branch-
            type=ref,event=pr,prefix=pr-

      - name: Build (and push on non-PR events)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/triage/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
